name: Build a signed-feed draft release
on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        description: Launcher release channel
        options: [stable, beta]
        default: stable
permissions:
  contents: read
concurrency:
  group: usagi-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run package:win
      - name: Sign release metadata with the owner key
        env:
          USAGI_APP_SIGNING_KEY: ${{ secrets.USAGI_APP_SIGNING_KEY }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: node tools/github-sign-release.mjs
      - name: Create a draft with immutable installer and signed feed assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: node tools/github-create-draft.mjs
      - name: Remove temporary signing key
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath "$env:RUNNER_TEMP/usagi-app-private.pem" -Force -ErrorAction SilentlyContinue
