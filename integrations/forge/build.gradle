plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
version = '0.1.0'
group = 'smp.usagi.social'
base { archivesName = 'usagi-social-forge' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { usagisocial { source sourceSets.main } }
        }
        server { args '--nogui' }
        gameTestServer { property 'forge.enabledGameTestNamespaces', 'usagisocial' }
    }
}
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.28' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar.finalizedBy('reobfJar')
tasks.register('writeWireClasspath') {
    dependsOn testClasses
    doLast { file('build/wire-classpath.txt').text = sourceSets.test.runtimeClasspath.asPath }
}
